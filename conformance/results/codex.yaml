# A conformance run against one client.
#
# Fill in `outcome` for each case: pass | fail | unmeasured.
# Leave anything you did not personally observe as `unmeasured` — an
# unmeasured case is a useful, honest datum; a guessed one poisons the table.
#
# A failure is a bug report, not a verdict. The likeliest explanations, in
# order: the corpus is wrong, the installation was wrong, the client is wrong.
#
# See conformance/PROTOCOL.md for how to install a case into each client.

target: codex
version: "codex-cli 0.153.4"
platform: "macOS 15 / arm64"
tested_by: "masihmoloodian"
tested_on: "2026-09-10"
method: |
  Through Codex's own plugin path, which is the thing the corpus was written to
  ask about and which was closed the last three times we tried it. On 0.144.5
  there was no Agent Plugins support at all; on 0.151.0 `codex plugin add`
  rejected a conformant package with "missing plugin.json"; on 0.153.4 it
  installs one. The earlier run reached the cases through $CODEX_HOME/skills
  instead and is kept, superseded, in codex-skills-directory.yaml.

  Each case was published as the sole plugin of a local marketplace and
  installed with `codex plugin add`, in its own CODEX_HOME. The isolation is
  load-bearing: `codex mcp list` does not namespace server names by plugin, so
  two cases both declaring "local" in a shared home would overwrite each other
  and produce a count that looks right.

  Three things were then read back, none of which needs a model call or an
  authenticated session:

    - loads:      the exit status of `codex plugin add`.
    - skills:     `codex debug prompt-input`, which renders the model-visible
                  skills block with a per-skill source locator, namespaced by
                  plugin.
    - mcpServers: `codex mcp list --json`. This is new — on 0.151.0 the command
                  showed only servers configured in config.toml, and a plugin's
                  own servers were invisible to it. On 0.153.4 it reports what
                  Codex resolved from the package, including the injected
                  environment and the working directory, which is what makes
                  the MCP half of the corpus answerable at all.

  Where a case expects some servers to survive and others not, the surviving
  names were compared rather than the count. A count can match while the wrong
  server survived, and in four of these cases it would have.

  The marketplace keys on a plugin name and Codex checks it against the
  package's own, so the three cases whose manifests are invalid could not be
  addressed normally. Each was re-run as a single-field control against a
  known-good baseline, to establish that the rejection was for the reason the
  case is about and not an artifact of the harness.

# Controls run to confirm the three rejections, each changing one field of a
# package that installs cleanly:
#
#   {"$schema": ".../1.0.0/...", "name": "acme-tools"}   -> installs
#   name "acme--tools" (consecutive hyphens)             -> rejected  (§5.5)
#   name absent                                          -> rejected  (§5.3)
#   $schema .../2.0.0/...                                -> rejected  (§5.2)
#   $schema absent, name valid                           -> "missing plugin.json"
#
# The last line is the answer to a question this project had open for a month.
# Codex identifies an Agent Plugins package by its $schema. Without one it
# looks for .codex-plugin/plugin.json instead and reports it missing — which
# is the error we spent three versions attributing to the manifest's location.

results:
  - id: 001-minimal-manifest
    outcome: pass
    notes: "Installs. Contributes nothing, which is what a manifest with only the required fields should do."
  - id: 002-unknown-top-level-field
    outcome: pass
    notes: "Installs and skill `one` loads. The unknown field is ignored rather than fatal. Whether it is reported anywhere is still not observable from the CLI."
  - id: 003-non-object-extensions
    outcome: pass
    notes: "Installs and skill `one` loads. Not rejected for the non-object extensions field."
  - id: 004-missing-required-name
    outcome: pass
    notes: "Rejected: `missing or invalid plugin.json`. Confirmed by control — the same package with a valid name installs, so the name is what it objected to."
  - id: 005-invalid-name-consecutive-hyphens
    outcome: pass
    notes: "Rejected. Control isolates it to the name: `acme--tools` is refused and `acme-tools` installs, with nothing else changed. §5.5's grammar is enforced."
  - id: 006-unsupported-spec-version
    outcome: pass
    notes: "Rejected. Control isolates it to $schema: 2.0.0 is refused where 1.0.0 installs. A plugin targeting a version Codex does not implement does not load."
  - id: 007-skills-immediate-children-only
    outcome: pass
    notes: >-
      Loads `alpha` and `beta`, and not the third skill at skills/group/deep/.
      This is the same client that loads all three through $CODEX_HOME/skills,
      where the scan is recursive. The plugin path scans one level, as §7.1
      requires. The route the package arrived by decides which answer you get.
  - id: 008-skill-directory-without-skill-md
    outcome: pass
    notes: "Loads `real` only. A directory under skills/ with no SKILL.md is skipped rather than treated as an empty skill."
  - id: 009-no-components
    outcome: pass
    notes: "Installs and contributes nothing. A plugin with no components is valid and is not mistaken for a broken one."
  - id: 010-mcp-invalid-entry-isolated
    outcome: pass
    notes: "Skill `one` loads and exactly one server survives — `good`. The malformed `bad` is dropped without taking its neighbour with it, which is what §7.2.2 asks for."
  - id: 011-mcp-version-mismatch
    outcome: pass
    notes: "Skill `one` loads; no servers. The version mismatch disables MCP and leaves the rest of the plugin working, rather than failing the whole package."
  - id: 012-mcp-command-escapes-root
    outcome: pass
    notes: "The plugin installs and `escape` does not survive. A command of `../bin/server` is refused, so §4.1 containment is enforced on the command path."
  - id: 013-mcp-insecure-url
    outcome: pass
    notes: "`local` survives and `remote` does not. Plain HTTP to a non-loopback host is refused while loopback is allowed — the distinction §7.2.1 draws, not a blanket ban on http."
  - id: 014-mcp-reserved-env
    outcome: pass
    notes: "`fine` survives and `reserved` does not. A server naming a reserved environment variable is invalidated, and only that server."
  - id: 015-mcp-cwd-escapes-root
    outcome: pass
    notes: "The plugin installs and `escape` does not survive. §4.1 containment is enforced on cwd as well as on command, which is the pair that has to hold together."
  - id: 016-extension-namespace-preserved
    outcome: pass
    notes: "Skill `one` loads. A foreign extension namespace is carried without being validated, as §8.1 requires."
  - id: 017-mcp-empty-servers
    outcome: pass
    notes: "Installs with no servers. An empty mcpServers object is valid and is not read as a malformed file."
  - id: 018-mcp-all-transports
    outcome: fail
    notes: >-
      Two of three. `local` (stdio) and `http` (streamable-http) are resolved;
      `legacy` (sse) is absent from `codex mcp list --json` with no
      disabled_reason and no error at install. §7.2.1 makes all three a SHOULD
      rather than a MUST, so this is the mildest kind of miss — but a package
      whose only server is SSE would install successfully and do nothing, with
      nothing anywhere saying why.

# Two things worth recording that no single case covers, both read off
# `codex mcp list --json` for a resolved stdio server:
#
#   §9.1  PLUGIN_ROOT and PLUGIN_DATA are both injected, as absolute paths, and
#         PLUGIN_DATA is a separate per-plugin directory rather than an alias
#         for the root — plugins/data/agent-plugins/<hash> against
#         plugins/cache/<marketplace>/<name>/<version>.
#
#   §7.2.1 cwd is defaulted to the plugin root when the server does not set one.
#          Codex accepts it and uses it; two of the other clients accept the
#          field and ignore it, which is why agentbridge wraps their servers in
#          a launcher.
