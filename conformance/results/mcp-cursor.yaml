# An MCP configuration corpus run against one client.
#
# `outcome` describes the whole path a server takes: portable declaration ->
# agentbridge's translation -> the client's own configuration -> the client.
# That is what a user experiences. `notes` records which layer produced the
# outcome, because "agentbridge refused to write it" and "the client refused it"
# are different facts and only one of them is about the client.
#
# See conformance/mcp/README.md.

target: cursor
version: "Cursor 3.18.9"
platform: "macOS 15 / arm64"
tested_by: "masihmoloodian"
tested_on: "2026-08-30"
method: |
  Each case was installed with `agentbridge install` into ~/.cursor/mcp.json.
  Cursor has no CLI that reports MCP state, so every case needs someone to open
  its MCP view; the probe cases additionally need Cursor to have started the
  server.
results:
  - id: M01-stdio-server
    outcome: unmeasured
    notes: "Written into the client's configuration by agentbridge, but whether the client offers it has not been observed — that needs a person looking at the client's MCP view."
  - id: M02-http-server
    outcome: unmeasured
    notes: "Written into the client's configuration by agentbridge, but whether the client offers it has not been observed — that needs a person looking at the client's MCP view."
  - id: M03-sse-server
    outcome: unmeasured
    notes: "Written into the client's configuration by agentbridge, but whether the client offers it has not been observed — that needs a person looking at the client's MCP view."
  - id: M04-invalid-entry-isolated
    outcome: unmeasured
    notes: "Only `good` was written; whether the client offers it is unobserved."
  - id: M05-unknown-field-isolated
    outcome: unmeasured
    notes: "Only `fine` was written; whether the client offers it is unobserved."
  - id: M06-empty-servers
    outcome: pass
    notes: "Nothing was written and nothing broke — observable without asking the client, because the assertion is that an empty set is not an error."
  - id: M07-insecure-remote-url
    outcome: pass
    notes: "No plain-HTTP remote server reached the client; agentbridge refused it. The client's own gate was not exercised."
  - id: M08-loopback-http-allowed
    outcome: unmeasured
    notes: "Written into the client's configuration by agentbridge, but whether the client offers it has not been observed — that needs a person looking at the client's MCP view."
  - id: M09-reserved-env-refused
    outcome: unmeasured
    notes: "Only `fine` was written; whether the client offers it is unobserved."
  - id: M10-spec-env-provided
    outcome: unmeasured
    notes: "Written, but Cursor had not launched the probe when this was recorded — the probe's output was from VS Code, identified by the VSCODE_* variables in its environment."
  - id: M11-cwd-honoured
    outcome: unmeasured
    notes: "As M10: not yet launched by Cursor."
