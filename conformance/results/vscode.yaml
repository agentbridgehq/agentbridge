# A conformance run against one client.
#
# Fill in `outcome` for each case: pass | fail | unmeasured.
# Leave anything you did not personally observe as `unmeasured` — an
# unmeasured case is a useful, honest datum; a guessed one poisons the table.
#
# A failure is a bug report, not a verdict. The likeliest explanations, in
# order: the corpus is wrong, the installation was wrong, the client is wrong.
#
# See conformance/PROTOCOL.md for how to install a case into each client.

target: vscode
version: "VS Code 1.135.0"          # the client version you tested — a result without one cannot be retired
platform: "macOS 15 / arm64"         # e.g. macOS 15 / arm64
tested_by: "masihmoloodian"
tested_on: "2026-08-30"        # YYYY-MM-DD
method: |
  VS Code has no Agent Plugins installer, so there is nothing to point at a
  package. Each case's skills/ directory was registered instead through
  chat.agentSkillsLocations, which is the documented way to add a skills root and
  the mechanism the adapter uses.

  That means no manifest is consulted, so every manifest-validation case is
  unmeasured for the same reason as on Codex and opencode.

  Read back by asking VS Code to list every skill and its source. Asked once it
  reported "one" a single time, grouped as "AgentBridge corpus"; asked again for
  the full folder path behind every skill of that name, it listed all six roots
  separately. That is worth knowing on its own: **VS Code does not drop skills
  that collide by name.** Six skills called `one`, from six different roots, were
  all loaded. Name collision across plugins is not hypothetical, and this is the
  behaviour that decides whether flattening plugins into a shared skills
  directory would have been safe. It would not have been legible, but nothing is
  silently lost.

results:
  - id: 001-minimal-manifest
    outcome: unmeasured
    notes: "No components, so nothing is observable either way."
  - id: 002-unknown-top-level-field
    outcome: pass
    notes: "Skill `one` loaded from the 002 root. Not rejected for the unknown top-level field. Whether the field is reported anywhere is not observable from the chat surface."
  - id: 003-non-object-extensions
    outcome: pass
    notes: "Skill `one` loaded from the 003 root. Not rejected for the non-object extensions field."
  - id: 004-missing-required-name
    outcome: unmeasured
    notes: "Skill `one` loaded from the 004 root, so a component of a manifest-invalid plugin is reachable. Not scored: VS Code has no Agent Plugins installer, the case was registered as a skills root, and no manifest was ever consulted. Recorded rather than scored, as on Codex and opencode."
  - id: 005-invalid-name-consecutive-hyphens
    outcome: unmeasured
    notes: "The case ships no skills, and Cursor's inventory is skill-derived, so a rejected and an accepted plugin look identical."
  - id: 006-unsupported-spec-version
    outcome: unmeasured
    notes: "As 005."
  - id: 007-skills-immediate-children-only
    outcome: pass
    notes: "Exactly `alpha` and `beta`. The skill at skills/group/deep/ was not loaded, which is what §7.1 requires and what Codex and opencode both get wrong."
  - id: 008-skill-directory-without-skill-md
    outcome: pass
    notes: "Exactly `real`. The directory without a SKILL.md was ignored."
  - id: 009-no-components
    outcome: unmeasured
    notes: "Nothing to observe."
  - id: 010-mcp-invalid-entry-isolated
    outcome: unmeasured
    notes: "The skill loaded, but the case's primary assertion is that the valid MCP server survives alongside an invalid one, and VS Code does not read a package's mcp.json."
  - id: 011-mcp-version-mismatch
    outcome: unmeasured
    notes: "As 010: the skill is observable, the MCP assertion is not."
  - id: 012-mcp-command-escapes-root
    outcome: unmeasured
    notes: "MCP only; Cursor does not read a package's mcp.json."
  - id: 013-mcp-insecure-url
    outcome: unmeasured
    notes: "MCP only."
  - id: 014-mcp-reserved-env
    outcome: unmeasured
    notes: "MCP only."
  - id: 015-mcp-cwd-escapes-root
    outcome: unmeasured
    notes: "MCP only."
  - id: 016-extension-namespace-preserved
    outcome: pass
    notes: "Skill `one` loaded from the 016 root; the foreign extension namespace did not prevent loading."
  - id: 017-mcp-empty-servers
    outcome: unmeasured
    notes: "MCP only."
  - id: 018-mcp-all-transports
    outcome: unmeasured
    notes: "MCP only."
