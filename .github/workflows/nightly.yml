name: Nightly

on:
  schedule:
    # 07:00 UTC, which is before the working day in Europe and after it in the
    # Americas — a drift report is only useful if somebody reads it that day.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream:
    name: upstream drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # The specification, its schemas, and the vendor documentation each
      # adapter's paths came from all move on other people's schedules. Nothing
      # in this repository changes overnight; those do, and today the first
      # signal would be a user reporting that installs stopped working.
      - name: Check upstream sources
        id: specwatch
        run: |
          go run ./internal/tools/specwatch --json > specwatch.json || echo "drift=true" >> "$GITHUB_OUTPUT"
          go run ./internal/tools/specwatch || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the corpus still passes
        run: go run ./cmd/agentbridge conformance

      - name: Confirm generated documentation is current
        run: |
          make docs
          git diff --exit-code docs/clients.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specwatch
          path: specwatch.json

      # One open issue, updated rather than duplicated. A nightly that files a
      # new issue every morning is a nightly people mute.
      - name: Open or update the drift issue
        if: steps.specwatch.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('specwatch.json', 'utf8'));
            const moved = report.checks.filter(c => c.status !== 'ok');

            const body = [
              'Something this project is built on has changed upstream.',
              '',
              '| Check | Status | Detail |',
              '|---|---|---|',
              ...moved.map(c => `| \`${c.name}\` | ${c.status} | ${c.detail} |`),
              '',
              '### What to do',
              '',
              ...moved.filter(c => c.action).map(c => `- **${c.name}** — ${c.action}`),
              '',
              `_Checked ${report.checkedAt} by [the nightly run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
            ].join('\n');

            const title = 'Upstream sources have changed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-drift',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-drift'],
              });
            }
