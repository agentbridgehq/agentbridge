name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Sigstore keyless signing and build attestations both authenticate through
  # the workflow's OIDC identity, which is what binds a signature to this
  # repository and this workflow rather than to a key someone holds.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the changelog from history, so a shallow clone
          # produces a release whose notes are silently wrong.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify the tree before releasing
        run: |
          go vet ./...
          go test ./...
          make licenses

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      # SLSA build provenance, attesting which workflow and which commit
      # produced these bytes. This is separate from the cosign signature: the
      # signature says the artifact was not altered after the build, the
      # attestation says where the build came from.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
