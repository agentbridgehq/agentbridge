name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test -race -cover ./...

  # M0-2: the CLI ships as a single static binary for every supported platform.
  # A change that breaks any target must fail here, not at release time.
  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make cross

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      # Built from source with this workflow's Go toolchain rather than
      # downloaded as a prebuilt binary.
      #
      # The action's "latest" resolves to a release built with an older Go, and
      # golangci-lint refuses to load a go.mod whose language version is newer
      # than the one it was compiled with — so a prebuilt binary fails against
      # Go 1.26 with "the Go language version used to build golangci-lint is
      # lower than the targeted Go version". Compiling it here makes the two
      # versions the same by construction, which also means bumping GO_VERSION
      # never breaks linting again.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  # M8: a release pipeline is otherwise exercised for the first time at exactly
  # the moment it must not fail. Validating the config and the wrapper on every
  # pull request moves that failure to where it is cheap.
  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the npm wrapper
        working-directory: npm
        run: node --test
      - name: Shellcheck the installer
        run: shellcheck install.sh

  # M0-3: fail the build on a dependency whose license would contaminate
  # commercial code. See docs/08-tech-stack.md section 9.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make licenses

  # M0-4: every commit must carry a Developer Certificate of Origin sign-off.
  # Retrofitting provenance across contributors later is not practical.
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit in the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::commit $sha is missing 'Signed-off-by: $author'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Sign commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits signed off."
