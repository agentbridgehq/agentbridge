name: Publish to npm

# Publishing happens over OIDC trusted publishing, so there is no npm token in
# this repository and nothing to leak or rotate. npm mints a short-lived
# credential from the workflow's own identity, the same mechanism Sigstore uses
# to sign the release artifacts.
#
# Two things must be true on npmjs.com before this can work, and npm does not
# validate either when you save them:
#
#   1. The package must already exist. A trusted publisher is configured on a
#      package's settings page, and there is no page until something has been
#      published — so the first version has to go up from a laptop with a 2FA
#      code. See npm/cli#8544.
#   2. The trusted publisher must name this repository AND this file, exactly:
#      npm-publish.yml. Renaming this file silently breaks publishing.
#
# Trusted publishing also attaches provenance automatically, which is the point:
# a package that claims to be built from this commit, attested by npm rather
# than asserted by us.

# Triggered by the tag, not by `release: published`.
#
# The obvious trigger does not work here and fails silently, which is worse than
# failing. GitHub does not raise workflow events for a release created using
# GITHUB_TOKEN, to stop a workflow triggering itself — and GoReleaser creates
# the release with exactly that token. v0.2.0 shipped, the release appeared, and
# this workflow never ran or reported anything.
#
# The tag fires reliably. The job then waits for the release the other workflow
# is building, because the two now start at the same moment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  # Lets the job request an OIDC token. Without it npm has no identity to trust
  # and publishing falls back to asking for a token that does not exist here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 is the current LTS and ships an npm that already supports
          # trusted publishing, so the upgrade below is a safety net rather
          # than the thing this depends on. Pinning the major matters: the npm
          # that can publish over OIDC has a floor on the Node version too, and
          # a runner on an older line fails while installing npm rather than
          # while publishing, which reads like an unrelated problem.
          node-version: "24"
          # No registry-url on purpose. It makes setup-node write an .npmrc
          # containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, and
          # NODE_AUTH_TOKEN does not exist here because the whole point is that
          # there is no token. npm then authenticates as nobody rather than
          # exchanging its OIDC identity, and the registry answers 404 — "could
          # not be found or you do not have permission" — which reads like a
          # missing package or an unsaved trusted publisher rather than a
          # credential we supplied and left blank. The default registry is
          # already registry.npmjs.org, so the setting bought nothing.

      - name: Require an npm that can publish over OIDC
        # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. An npm
        # without it does not say so — it asks for a token that does not exist
        # here and reports an authentication failure, sending you looking for a
        # credential problem that is really a version problem. So the version
        # is checked, out loud, before publishing.
        run: |
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is older than $need; upgrading"
            npm install -g npm@latest
            have=$(npm --version)
          fi
          echo "node $(node --version), npm $have"

      - name: Wait for the release to be published
        # The release workflow starts on the same tag push and takes a couple of
        # minutes to build, sign and upload. Publishing to npm before its
        # artifacts exist would put a package on the registry whose postinstall
        # 404s, and an npm version cannot be reused.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          for i in $(seq 1 60); do
            if gh release view "$tag" --repo "${{ github.repository }}" \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -q checksums.txt; then
              echo "release $tag is published"
              exit 0
            fi
            echo "waiting for release $tag ($i/60)"
            sleep 10
          done
          echo "release $tag did not appear; is the release workflow failing?"
          exit 1

      - name: Check the package version matches the release
        # install.js derives the download URL from package.json's version, so a
        # package published as 0.1.1 against a v0.1.0 release installs a URL
        # that does not exist. The failure would land on whoever ran
        # `npm i -g @agentbridgehq/agentbridge`, not on us.
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          expected="${tag#v}"
          actual=$(node -p "require('./npm/package.json').version")
          if [ "$expected" != "$actual" ]; then
            echo "npm/package.json is $actual but the release is $tag."
            echo "Set the version to $expected and commit before publishing."
            exit 1
          fi
          echo "version $actual matches $tag"

      - name: Verify the release artifacts this package will download
        # Publishing a package whose postinstall 404s is worse than not
        # publishing: npm caches the version number forever and it cannot be
        # reused. Checking first costs one request.
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          for a in darwin_arm64.tar.gz darwin_amd64.tar.gz linux_amd64.tar.gz linux_arm64.tar.gz; do
            url="${base}/agentbridge_${tag#v}_${a}"
            curl -fsSLI -o /dev/null "$url" || { echo "missing: $url"; exit 1; }
            echo "ok: $url"
          done
          curl -fsSLI -o /dev/null "${base}/checksums.txt" || { echo "missing checksums.txt"; exit 1; }

      - run: npm test
        working-directory: npm

      - name: Publish
        run: npm publish --access public
        working-directory: npm
